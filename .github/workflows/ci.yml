name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: threevo
          POSTGRES_PASSWORD: threevo_secret
          POSTGRES_DB: threevo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U threevo -d threevo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://threevo:threevo_secret@localhost:5432/threevo_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test environment
        run: cp .env.test.example .env.test

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Security audit (high and critical)
        run: npm audit --audit-level=high
