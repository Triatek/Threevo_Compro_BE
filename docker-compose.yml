services:
  postgres:
    image: postgres:17-alpine
    container_name: threevo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: threevo
      POSTGRES_PASSWORD: threevo_secret
      POSTGRES_DB: threevo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threevo -d threevo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
