# Example production stack: API + PostgreSQL.
# Usage:
#   Copy-Item .env.production.example .env.production   (then fill in the values)
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-threevo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No published port: only the api container can reach the database.

  api:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-threevo_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Only reachable from the host; Nginx proxies public traffic.
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  postgres_data:
  uploads:
