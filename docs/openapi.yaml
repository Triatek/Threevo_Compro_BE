components:
  schemas:
    SuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          const: false
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - INVALID_JSON
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PAYLOAD_TOO_LARGE
                - VALIDATION_ERROR
                - TOO_MANY_REQUESTS
                - INTERNAL_SERVER_ERROR
                - SERVICE_UNAVAILABLE
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  location:
                    type: string
                    enum:
                      - body
                      - query
                      - params
                  field:
                    type: string
                  message:
                    type: string
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 42
        totalPages:
          type: integer
          example: 5
        hasNextPage:
          type: boolean
        hasPrevPage:
          type: boolean
    Health:
      type: object
      properties:
        status:
          type: string
          example: OK
        uptime:
          type: integer
          description: Detik sejak server berjalan
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            database:
              type: string
              enum:
                - up
                - down
    Role:
      type: string
      enum:
        - SUPER_ADMIN
        - EDITOR
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        isActive:
          type: boolean
        lastLoginAt:
          type:
            - string
            - "null"
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuditLog:
      type: object
      properties:
        id:
          type: integer
        userId:
          type:
            - integer
            - "null"
        action:
          type: string
          example: UPDATE
        entity:
          type: string
          example: Article
        entityId:
          type:
            - string
            - "null"
        metadata:
          type:
            - object
            - "null"
        ipAddress:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        user:
          type:
            - object
            - "null"
          properties:
            id:
              type: integer
            name:
              type: string
            email:
              type: string
    ReorderItems:
      type: array
      minItems: 1
      items:
        type: object
        required:
          - id
          - sortOrder
        properties:
          id:
            type: integer
          sortOrder:
            type: integer
            minimum: 0
      example:
        - id: 3
          sortOrder: 0
        - id: 1
          sortOrder: 1
    ImageUrl:
      type: string
      description: URL http(s) atau path `/uploads/...` dari POST /admin/media
      example: /uploads/2026/01/abc.webp
    BannerInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 150
        subtitle:
          type:
            - string
            - "null"
          maxLength: 300
        image:
          $ref: "#/components/schemas/ImageUrl"
        ctaText:
          type:
            - string
            - "null"
          maxLength: 50
        ctaLink:
          type:
            - string
            - "null"
          description: URL http(s) atau path diawali "/"
        sortOrder:
          type: integer
          default: 0
        isActive:
          type: boolean
          default: true
    ClientInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        logo:
          $ref: "#/components/schemas/ImageUrl"
        website:
          type:
            - string
            - "null"
          format: uri
        sortOrder:
          type: integer
          default: 0
        isActive:
          type: boolean
          default: true
    TestimonialInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        position:
          type:
            - string
            - "null"
        company:
          type:
            - string
            - "null"
        message:
          type: string
