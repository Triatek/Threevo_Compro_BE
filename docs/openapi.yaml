openapi: 3.1.0
info:
  title: Threevo Compro API
  version: 1.0.0
  description: |
    REST API untuk website company profile Threevo (CMS, lead, proxy tracking).

    Semua respons memakai format standar:
    - Sukses: `{ "success": true, "message"?: string, "data": ..., "meta"?: {...} }`
    - Error: `{ "success": false, "error": { "code", "message", "details"? } }`
servers:
  - url: http://localhost:4000/api/v1
    description: Development
tags:
  - name: System
  - name: Auth
  - name: Admin - Users
  - name: Admin - Audit Logs
  - name: Public
  - name: Admin - Settings
  - name: Admin - Banners
  - name: Admin - Clients
  - name: Admin - Testimonials
  - name: Admin - Services
  - name: Admin - Locations
  - name: Admin - Categories
  - name: Admin - Articles
paths:
  /health:
    get:
      tags:
        - System
      summary: Health check (termasuk koneksi database)
      responses:
        "200":
          description: Server dan database sehat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Health"
        "503":
          description: Database tidak dapat dihubungi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: SERVICE_UNAVAILABLE
                  message: Layanan sedang tidak tersedia
                  details:
                    - field: database
                      message: Database tidak dapat dihubungi
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login (set cookie access_token & refresh_token)
      description: Rate limit 10 request / 15 menit per IP. Pesan gagal selalu sama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Perbarui sesi (rotasi refresh token)
      description: Memakai cookie `refresh_token` (path /api/v1/auth). Token lama langsung tidak berlaku. Memakai ulang token lama mencabut semua sesi user.
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout (cabut refresh token & hapus cookie)
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: "null"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Profil user yang login
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me/password:
    patch:
      tags:
        - Auth
      summary: Ganti password sendiri
      description: Semua sesi lain dicabut; sesi saat ini tetap aktif. Password lama salah → 422.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: Minimal 8 karakter, mengandung huruf dan angka
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /admin/users:
    get:
      tags:
        - Admin - Users
      summary: Daftar user (SUPER_ADMIN)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Q"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - name: isActive
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Admin - Users
      summary: Buat user (SUPER_ADMIN)
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: Minimal 8 karakter, mengandung huruf dan angka
                role:
                  $ref: "#/components/schemas/Role"
                isActive:
                  type: boolean
                  default: true
      responses:
        "201":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Admin - Users
      summary: Detail user
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Admin - Users
      summary: Ubah user
      description: Tidak bisa menonaktifkan/mengubah role diri sendiri atau super admin aktif terakhir. Ganti password/nonaktifkan mencabut semua sesi user tersebut.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                  description: Minimal 8 karakter, mengandung huruf dan angka
                role:
                  $ref: "#/components/schemas/Role"
                isActive:
                  type: boolean
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags:
        - Admin - Users
      summary: Nonaktifkan user (data tidak dihapus)
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SuccessResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
